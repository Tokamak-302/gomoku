<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>棋类对战 · 选择玩法</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 800px at 20% 0%, #232a36, #12151b 60%);
    color: #e8e8ea;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .app { width: 100%; max-width: 860px; }
  h1 { margin: 0 0 6px; font-size: 30px; letter-spacing: 4px; text-align: center; font-weight: 700; }
  .sub { margin: 0 0 34px; text-align: center; color: #8f9bb0; font-size: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
  .card {
    display: block; text-decoration: none; color: inherit;
    background: #1b212c; border: 1px solid #2a3140; border-radius: 16px;
    padding: 26px 24px; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  }
  .card:hover {
    transform: translateY(-4px); border-color: #3d6fd4;
    box-shadow: 0 14px 36px rgba(0,0,0,.45);
  }
  .icon { height: 66px; display: flex; align-items: center; margin-bottom: 16px; }
  .stones { position: relative; width: 80px; height: 66px; }
  .stone { position: absolute; width: 36px; height: 36px; border-radius: 50%; }
  .stone.b { background: radial-gradient(circle at 35% 30%, #666, #111); }
  .stone.w { background: radial-gradient(circle at 35% 30%, #fff, #c9c9c9); }
  .stones .s1 { left: 0; top: 16px; }
  .stones .s2 { left: 22px; top: 2px; }
  .stones .s3 { left: 44px; top: 16px; }
  .xq { display: flex; gap: 8px; }
  .xq span {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 700;
    border: 2px solid #8a4a2a; background: #f6e6c0; color: #b22222;
    font-family: "KaiTi", "STKaiti", "SimSun", serif;
  }
  .xq span.dark { color: #222; }
  h2 { margin: 0 0 8px; font-size: 20px; }
  p { margin: 0 0 16px; color: #9fb0c9; font-size: 13px; line-height: 1.7; }
  .go { color: #6fa0ff; font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <h1>棋类对战</h1>
  <p class="sub">选择一种玩法开始 · 开两个窗口即可联机对弈</p>
  <div class="cards">
    <a class="card" href="gomoku.html">
      <div class="icon">
        <div class="stones">
          <div class="stone b s1"></div>
          <div class="stone w s2"></div>
          <div class="stone b s3"></div>
        </div>
      </div>
      <h2>五子棋</h2>
      <p>15×15 棋盘 · 连五获胜 · 活三/冲四提示 · 悔棋 · 双方确认重开</p>
      <span class="go">开始对局 →</span>
    </a>
    <a class="card" href="xiangqi.html">
      <div class="icon">
        <div class="xq">
          <span>車</span><span>馬</span><span class="dark">砲</span><span>兵</span>
        </div>
      </div>
      <h2>中国象棋</h2>
      <p>9×10 棋盘 · 红方先行 · 将死获胜 · 悔棋 · 双方确认重开</p>
      <span class="go">开始对局 →</span>
    </a>
  </div>
</div>
</body>
</html>
